<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEI 加重平均シミュレーター</title>
<style>
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f4;
  --text-primary: #1a1a1a;
  --text-secondary: #6b6b6b;
  --text-tertiary: #999;
  --border: rgba(0,0,0,0.12);
  --border-hover: rgba(0,0,0,0.25);
  --info-bg: #E6F1FB;
  --info-border: #85B7EB;
  --info-text: #0C447C;
  --radius: 8px;
  --radius-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #1e1e1e;
    --bg-secondary: #2a2a2a;
    --text-primary: #e8e8e8;
    --text-secondary: #aaa;
    --text-tertiary: #777;
    --border: rgba(255,255,255,0.12);
    --border-hover: rgba(255,255,255,0.25);
    --info-bg: #0C447C;
    --info-border: #378ADD;
    --info-text: #B5D4F4;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--text-primary); background: var(--bg-primary); padding: 1.5rem; max-width: 640px; margin: 0 auto; }
h1 { font-size: 20px; font-weight: 500; margin-bottom: 1.25rem; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 0.5px solid var(--border); }
.row:last-child { border-bottom: none; }
.label { min-width: 36px; font-weight: 500; font-size: 15px; }
.desc { font-size: 12px; color: var(--text-secondary); min-width: 80px; }
.slider-wrap { flex: 1; display: flex; align-items: center; gap: 10px; }
input[type="range"] { flex: 1; height: 4px; -webkit-appearance: none; appearance: none; background: var(--border); border-radius: 2px; outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--bg-primary); border: 2px solid currentColor; cursor: pointer; }
.pct { min-width: 44px; text-align: right; font-size: 14px; font-weight: 500; color: var(--text-secondary); }
.bei-input { width: 72px; text-align: center; font-size: 14px; padding: 6px; border: 0.5px solid var(--border-hover); border-radius: var(--radius); background: var(--bg-primary); color: var(--text-primary); }
.bei-input:focus { outline: none; box-shadow: 0 0 0 2px var(--info-border); }
.result-area { margin-top: 1.5rem; padding: 1.25rem; background: var(--bg-secondary); border-radius: var(--radius-lg); text-align: center; }
.result-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
.result-val { font-size: 32px; font-weight: 500; }
.lock-btn { width: 28px; height: 28px; border-radius: 50%; border: 0.5px solid var(--border-hover); background: var(--bg-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; color: var(--text-secondary); }
.lock-btn.locked { background: var(--info-bg); border-color: var(--info-border); color: var(--info-text); }
.header { display: flex; gap: 12px; align-items: center; padding: 0 0 8px; font-size: 12px; color: var(--text-tertiary); }
.header span:first-child { min-width: 36px; }
.header .h-desc { min-width: 80px; }
.header .h-slider { flex: 1; text-align: center; }
.header .h-pct { min-width: 44px; text-align: right; }
.header .h-bei { width: 72px; text-align: center; }
.header .h-lock { width: 28px; text-align: center; }
.formula { margin-top: 12px; font-size: 13px; color: var(--text-secondary); text-align: center; line-height: 1.6; }
</style>
</head>
<body>

<h1>BEI 加重平均シミュレーター</h1>

<div class="header">
  <span></span>
  <span class="h-desc">用途</span>
  <span class="h-slider">重み</span>
  <span class="h-pct">%</span>
  <span class="h-bei">BEI値</span>
  <span class="h-lock"></span>
</div>
<div id="rows"></div>
<div class="result-area">
  <div class="result-label">BEI/ALL（加重平均）</div>
  <div class="result-val" id="result">—</div>
  <div class="formula" id="formula"></div>
</div>

<script>
const items = [
  { key: 'AC', name: '空調', color: '#378ADD' },
  { key: 'V',  name: '換気', color: '#1D9E75' },
  { key: 'L',  name: '照明', color: '#BA7517' },
  { key: 'HW', name: '給湯', color: '#D4537E' },
  { key: 'EV', name: '昇降機', color: '#7F77DD' }
];
const state = {
  weights: [40, 15, 25, 10, 10],
  beis: [0.8, 0.9, 0.7, 1.0, 1.0],
  locked: [false, false, false, false, false]
};

const container = document.getElementById('rows');
const resultEl = document.getElementById('result');
const formulaEl = document.getElementById('formula');

function render() {
  container.innerHTML = '';
  items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="label" style="color:${it.color}">${it.key}</span>
      <span class="desc">${it.name}</span>
      <div class="slider-wrap">
        <input type="range" min="0" max="100" step="1" value="${state.weights[i]}" style="flex:1;accent-color:${it.color};color:${it.color}" data-idx="${i}" class="wslider">
      </div>
      <span class="pct">${state.weights[i]}%</span>
      <input type="number" class="bei-input" step="0.01" min="0" max="3" value="${state.beis[i]}" data-idx="${i}" data-type="bei">
      <button class="lock-btn ${state.locked[i] ? 'locked' : ''}" data-idx="${i}" title="${state.locked[i] ? 'ロック解除' : 'ロック（固定）'}">${state.locked[i] ? '\u{1F512}' : '\u{1F513}'}</button>
    `;
    container.appendChild(row);
  });
  updateResult();
}

function distribute(changedIdx, newVal) {
  const old = state.weights[changedIdx];
  newVal = Math.max(0, Math.min(100, newVal));
  const diff = newVal - old;
  if (diff === 0) return;

  const unlocked = [];
  for (let i = 0; i < 5; i++) {
    if (i !== changedIdx && !state.locked[i]) unlocked.push(i);
  }
  if (unlocked.length === 0) { state.weights[changedIdx] = old; return; }

  state.weights[changedIdx] = newVal;
  let remaining = -diff;
  let totalUnlocked = unlocked.reduce((s, j) => s + state.weights[j], 0);

  if (totalUnlocked === 0) {
    const each = Math.floor(remaining / unlocked.length);
    unlocked.forEach((j, idx) => {
      state.weights[j] = idx < unlocked.length - 1 ? each : remaining - (each * (unlocked.length - 1));
    });
  } else {
    let allocated = 0;
    unlocked.forEach((j, idx) => {
      if (idx === unlocked.length - 1) {
        state.weights[j] = Math.max(0, state.weights[j] + remaining - allocated);
      } else {
        const share = Math.round(remaining * (state.weights[j] / totalUnlocked));
        state.weights[j] = Math.max(0, state.weights[j] + share);
        allocated += share;
      }
    });
  }

  let sum = state.weights.reduce((a, b) => a + b, 0);
  if (sum !== 100) {
    const fix = 100 - sum;
    for (let k = unlocked.length - 1; k >= 0; k--) {
      const j = unlocked[k];
      const nv = state.weights[j] + fix;
      if (nv >= 0 && nv <= 100) { state.weights[j] = nv; break; }
    }
  }

  state.weights = state.weights.map(w => Math.max(0, Math.min(100, Math.round(w))));
}

function updateResult() {
  const totalW = state.weights.reduce((a, b) => a + b, 0);
  if (totalW === 0) { resultEl.textContent = '—'; formulaEl.textContent = ''; return; }
  let num = 0;
  const parts = [];
  items.forEach((it, i) => {
    num += state.weights[i] * state.beis[i];
    if (state.weights[i] > 0) parts.push(`${state.beis[i]}×${state.weights[i]}%`);
  });
  const val = num / totalW;
  resultEl.textContent = val.toFixed(3);
  resultEl.style.color = val <= 1.0 ? '#1D9E75' : '#E24B4A';
  formulaEl.textContent = '= (' + parts.join(' + ') + ') / 100';
}

document.addEventListener('input', e => {
  if (e.target.classList.contains('wslider')) {
    const idx = parseInt(e.target.dataset.idx);
    if (state.locked[idx]) return;
    distribute(idx, parseInt(e.target.value));
    render();
  }
  if (e.target.dataset.type === 'bei') {
    const idx = parseInt(e.target.dataset.idx);
    state.beis[idx] = parseFloat(e.target.value) || 0;
    updateResult();
  }
});

document.addEventListener('click', e => {
  const btn = e.target.closest('.lock-btn');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx);
  const lockedCount = state.locked.filter(Boolean).length;
  if (!state.locked[idx] && lockedCount >= 4) return;
  state.locked[idx] = !state.locked[idx];
  render();
});

render();
</script>
</body>
</html>
